[package]
name = "miniature-potato"
version = "0.1.0"
edition = "2021"


[dependencies]
bevy = { version = "0.16.1", features = ["dynamic_linking", "bevy_dev_tools"] }
rand = "0.8.5"
geotiles = { git = "https://github.com/rltvty/geotiles" }
bevy_panorbit_camera = "0.26.0"
iyes_perf_ui = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
